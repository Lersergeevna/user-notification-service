spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=notificationservice.dto.UserNotificationEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=notificationservice.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.admin.fail-fast=false
spring.kafka.listener.missing-topics-fatal=false
app.kafka.notifications.topic=user-notifications
app.kafka.notifications.partitions=1
app.kafka.notifications.replicas=1
app.mail.from=test-sender@example.com
app.site.name=\u0422\u0435\u0441\u0442\u043E\u0432\u044B\u0439 \u0441\u0430\u0439\u0442

spring.mail.host=127.0.0.1
spring.mail.port=3025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
management.health.mail.enabled=false
